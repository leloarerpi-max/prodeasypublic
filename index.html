<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Productivité</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23101C28'/%3E%3Crect x='6' y='14' width='4.5' height='12' rx='1.5' fill='%234DD0E1'/%3E%3Crect x='13.75' y='7' width='4.5' height='19' rx='1.5' fill='%2363D297'/%3E%3Crect x='21.5' y='11' width='4.5' height='15' rx='1.5' fill='%23F7CB4D'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Poppins:wght@500;600;700&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F7; --panel:#FFFFFF; --ink:#16212C; --muted:#5E6C7B; --line:#DCE2E9; --soft:#EDF0F4;
  --brand:#316FD4; --brand-ink:#FFFFFF; --sel:rgba(49,111,212,.10);
  --side:#0B2379; --side2:#0C2684; --side-ink:#D5DDF5; --side-mute:#8EA0D6; --side-on:rgba(255,255,255,.13);
  --pos:#17724A; --neg:#B3261E; --warn:#9A5B00; --warn-bg:#FFF4DF;
  --c-mail:#2F6BDB; --c-ech:#F0A03C; --c-cli:#2AA198; --c-urg:#D9534F;
  --sans:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1218; --panel:#131C25; --ink:#E6ECF2; --muted:#93A2B2; --line:#25313D; --soft:#1A2430;
    --brand:#7FB3FF; --brand-ink:#0B1218; --sel:rgba(127,179,255,.12);
    --side:#071447; --side2:#0A1B66; --pos:#5FD39A; --neg:#FF8A80; --warn:#F2B75B; --warn-bg:#2A2216;
    --c-mail:#5B92F5; --c-ech:#F2AE55; --c-cli:#4CC2B8; --c-urg:#F27F7A;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1218; --panel:#131C25; --ink:#E6ECF2; --muted:#93A2B2; --line:#25313D; --soft:#1A2430;
  --brand:#7FB3FF; --brand-ink:#0B1218; --sel:rgba(127,179,255,.12);
  --side:#071447; --side2:#0A1B66; --pos:#5FD39A; --neg:#FF8A80; --warn:#F2B75B; --warn-bg:#2A2216;
  --c-mail:#5B92F5; --c-ech:#F2AE55; --c-cli:#4CC2B8; --c-urg:#F27F7A;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num,.kv,.mprod b,td{font-variant-numeric:tabular-nums}

/* ---------- Structure ---------- */
.app{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh}
.side{background:linear-gradient(180deg,var(--side),var(--side2,var(--side)));color:var(--side-ink);padding:calc(20px + env(safe-area-inset-top,0px)) 12px 20px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:11px;align-items:center;padding:2px 10px 18px;color:#fff;text-decoration:none}
.brand b{display:block;font-size:16px;line-height:1.15;letter-spacing:-.01em}
.brand small{color:var(--side-mute);font-size:12.5px}
.grp{padding:18px 10px 6px;font-size:12.5px;color:var(--side-mute);font-weight:500}
.nv{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:inherit;text-decoration:none;font-weight:500;font-size:14.5px;position:relative}
.nv:hover{background:rgba(255,255,255,.05)}
.nv[aria-current="page"]{background:var(--side-on);color:#fff;box-shadow:inset 3px 0 0 #3B86FF}
.nv svg{flex:none;opacity:.85}
.nv .pd{width:11px;height:11px;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.14)}
.nv .fxm{width:18px;text-align:center;font-family:var(--mono);font-style:italic;font-size:13px;opacity:.85}
.nv .tg{margin-left:auto;font-size:11.5px;color:var(--side-mute)}
.main{padding:calc(24px + env(safe-area-inset-top,0px)) clamp(16px,3vw,40px) 64px;max-width:1260px;width:100%}
.ph{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 20px;margin-bottom:20px}
.ph h1{margin:0;font-size:clamp(24px,3vw,30px);letter-spacing:-.02em;line-height:1.1;display:flex;align-items:center;gap:12px}
.ph p{margin:6px 0 0;color:var(--muted);max-width:64ch}
.bar4{width:6px;height:30px;border-radius:3px;background:var(--c,var(--brand));flex:none}

/* ---------- Composants ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-width:0}
.panel h2{margin:0;font-size:16px;letter-spacing:-.005em}
.sub{color:var(--muted);font-size:13.5px;margin:2px 0 0}
.phd{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.g2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;margin-top:16px}
.stack{display:grid;gap:16px;margin-top:16px}
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:9px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.dng{color:var(--neg)}
.btn.sm{padding:5px 11px;font-size:13px}
.ib{width:34px;height:34px;border:1px solid var(--line);background:var(--panel);border-radius:9px;font-size:18px;line-height:1;display:grid;place-items:center}
.ib:hover{border-color:var(--muted)}
.mp{display:flex;gap:6px;align-items:center}
.mp select,.sel{height:34px;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:0 30px 0 12px;font-weight:600;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 14px,calc(100% - 12px) 14px;background-size:5px 5px;background-repeat:no-repeat}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);align-items:center}
.lg span,.chipt{display:inline-flex;align-items:center;gap:7px}
.lg i,.chipt i{width:11px;height:11px;border-radius:3px;background:var(--c);flex:none}
.chipt{border:1px solid var(--line);background:var(--panel);padding:4px 11px;border-radius:999px;font-size:13px;font-weight:500}
.chipt[aria-pressed="false"]{opacity:.5}
.chipt[aria-pressed="false"] i{background:transparent;box-shadow:inset 0 0 0 2px var(--c)}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12.5px;color:var(--muted)}
.pill.warn{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
.dl{font-weight:600}.dl.pos{color:var(--pos)}.dl.neg{color:var(--neg)}
.empty{color:var(--muted);padding:18px 0;text-align:center}

/* Indicateurs */
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--panel);border:1px solid var(--line);border-radius:12px}
.kpi{padding:16px 20px;border-left:1px solid var(--line);min-width:0}
.kpi:first-child{border-left:0}
.kl{display:block;color:var(--muted);font-size:13.5px}
.kv{display:block;font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin:3px 0 2px}
.kv small{font-size:15px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:3px}
.ks{display:block;color:var(--muted);font-size:13px}

/* Classement */
.rk{display:grid;grid-template-columns:minmax(84px,120px) minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;text-decoration:none;border-radius:8px}
.rk:hover{background:var(--soft)}
.rk .nm{display:flex;align-items:center;gap:8px;font-weight:600;white-space:nowrap}
.rk .nm i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.trk{height:10px;background:var(--soft);border-radius:5px;overflow:hidden;display:flex}
.trk i{display:block;height:100%;background:var(--c)}
.rk .v{font-weight:700;min-width:64px;text-align:right}
.rk .v small{font-weight:500;color:var(--muted);margin-left:4px}
.note-line{color:var(--muted);font-size:13px;margin-top:8px}

/* Graphiques */
.chart{width:100%;min-height:120px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:var(--sans);font-size:11.5px;fill:var(--muted)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .hit{fill:transparent}
.chart .hit:hover{fill:var(--sel)}
.chart .selb{fill:var(--sel)}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--panel);padding:8px 11px;border-radius:8px;font-size:12.5px;line-height:1.5;max-width:270px;box-shadow:0 6px 20px rgba(0,0,0,.22)}
.tip b{display:block;margin-bottom:2px}
.tip div{display:flex;align-items:center;gap:7px}
.tip div span{margin-left:auto;padding-left:14px;font-weight:600;font-variant-numeric:tabular-nums}
.tip i{width:9px;height:9px;border-radius:2px;background:var(--c);flex:none}

/* Fiche personne */
.mrow{display:grid;grid-template-columns:100px minmax(100px,1fr) 240px 120px 100px auto;gap:6px 14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.mrow>*{min-width:0}
.mrow:first-child{border-top:0}
.mname{font-weight:600}
.mname small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.mbar{height:12px;background:var(--soft);border-radius:6px;overflow:hidden;display:flex}
.mbar i{display:block;height:100%}
.mnums{font-size:13.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 0}
.mnums .nw{white-space:nowrap}
.mnums b{color:var(--ink);font-weight:600;margin-left:2px;margin-right:8px}
.mprod b{font-size:17px}
.mprod small,.mdays{color:var(--muted);font-size:12.5px;display:block}
.mrow.none{color:var(--muted)}
.mnote{grid-column:2/-1;font-size:13px;color:var(--warn);margin-top:-2px}
.mnote::before{content:"Remarque : ";font-weight:600}
.mcoef{display:inline-block;background:var(--soft);border-radius:5px;padding:0 6px;font-size:12px;color:var(--muted);margin-left:6px;font-weight:600}

/* Équipe */
.share{display:flex;height:34px;border-radius:8px;overflow:hidden;background:var(--soft)}
.share i{display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12.5px;font-weight:700;color:#12202C;min-width:0;overflow:hidden;white-space:nowrap;border-right:2px solid var(--panel)}
.share i:last-child{border-right:0}
.shl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 14px;margin-top:12px;font-size:13.5px}
.shl span{display:flex;align-items:center;gap:7px}
.shl i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.shl b{margin-left:auto;font-variant-numeric:tabular-nums}
.tl{list-style:none;padding:0;margin:0}
.tl li{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.tl li:first-child{border-top:0}
.tl b{font-weight:600}
.tl a{text-decoration:none;font-weight:600}
.tl a:hover{text-decoration:underline}

/* Formules */
.fgrid{display:grid;gap:14px}
.fc{border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:var(--panel)}
.fc h3{margin:0 0 8px;font-size:15.5px}
.fc .cl{margin:0 0 6px}
.fc .ex{margin:0 0 10px;padding:8px 12px;background:var(--soft);border-radius:8px;font-weight:600;font-variant-numeric:tabular-nums}
.xl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;font-family:var(--mono);font-size:12.5px;align-items:baseline;border-top:1px dashed var(--line);padding-top:9px}
.xl .a{color:var(--muted)}
.xl .f{overflow-wrap:anywhere}
.xl .r{font-weight:500;text-align:right;color:var(--muted)}
.xl .r b{color:var(--ink)}
.xl.head{border-top:0;padding-top:0;margin-bottom:2px;font-family:var(--sans);font-size:12.5px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.diff{background:var(--warn-bg);color:var(--ink);border-radius:12px;padding:16px 20px}
.diff h3{margin:0 0 6px;font-size:15.5px}
.diff ul{margin:6px 0 0;padding-left:20px}
.diff li{margin:5px 0}

/* Réglages */
.set{display:grid;gap:0}
.setrow{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between;padding:16px 0;border-top:1px solid var(--line)}
.setrow:first-child{border-top:0;padding-top:4px}
.setrow h3{margin:0;font-size:15px}
.setrow p{margin:2px 0 0;color:var(--muted);font-size:13.5px;max-width:56ch}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:7px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.sw{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.sw input{width:18px;height:18px;accent-color:var(--brand)}

/* Boîte de dialogue */
dialog{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--panel);color:var(--ink);width:min(580px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:hidden}
dialog[open]{display:flex;flex-direction:column}
dialog::backdrop{background:rgba(8,14,20,.55)}
.dh{padding:18px 22px 12px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.dh h2{margin:0;font-size:18px}
.dh p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.db{padding:2px 22px 16px;overflow:auto}
.df{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.ff{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.fld{display:grid;gap:4px}
.fld.w{grid-column:1/-1}
.fld label{font-size:13px;color:var(--muted);font-weight:500}
.fld input,.fld textarea{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 11px;font-size:15px;width:100%}
.fld input:focus,.fld textarea:focus{outline:2px solid var(--brand);outline-offset:0;border-color:transparent}
.fld small{color:var(--muted);font-size:12.5px}
.calc{margin-top:16px;border:1px solid var(--line);border-radius:10px;padding:4px 14px;background:var(--soft)}
.calc div{display:flex;flex-wrap:wrap;gap:2px 10px;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.calc div:first-child{border-top:0}
.calc span{color:var(--muted)}
.calc b{font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 18px;border-radius:10px;font-weight:600;font-size:14px;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.25)}

/* ---------- Adaptatif ---------- */
@media (max-width:1080px){
  .g2{grid-template-columns:minmax(0,1fr)}
  .mrow{grid-template-columns:96px minmax(0,1fr) 120px auto}
  .mrow .mnums{grid-column:2/4;grid-row:2}
  .mrow .mdays{grid-column:1;grid-row:2}
  .mrow .mprod{grid-column:3;grid-row:1}
  .mrow .mact{grid-column:4;grid-row:1}
  .mrow .mbar{grid-column:2}
  .two{grid-template-columns:1fr}
}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 12px 10px}
  .brand{padding-bottom:10px}
  .navs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
  .navs .grp{display:none}
  .nv{flex:none;white-space:nowrap;border:1px solid rgba(255,255,255,.12)}
  .nv .tg{display:none}
  .strip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi:nth-child(3){border-left:0}
  .kpi:nth-child(n+3){border-top:1px solid var(--line)}
}
@media (max-width:560px){
  .ff{grid-template-columns:1fr}
  .mrow{grid-template-columns:minmax(0,1fr) auto}
  .mrow .mname{grid-column:1;grid-row:1}
  .mrow .mact{grid-column:2;grid-row:1}
  .mrow .mbar{grid-column:1/-1;grid-row:2}
  .mrow .mnums{grid-column:1/-1;grid-row:3}
  .mrow .mprod{grid-column:1;grid-row:4}
  .mrow .mdays{grid-column:2;grid-row:4;text-align:right}
  .mnote{grid-column:1/-1}
  .tl li{grid-template-columns:1fr;gap:2px}
  .xl{grid-template-columns:1fr}
  .xl .r{text-align:left}
  .panel{padding:16px 14px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.empties{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px 0 2px;border-top:1px solid var(--line)}
.chip-add{border:1px dashed var(--muted);background:transparent;border-radius:999px;padding:3px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.chip-add:hover{border-color:var(--brand);color:var(--brand)}
.heatwrap{overflow-x:auto;margin-top:4px}
table.heat{border-collapse:separate;border-spacing:0;width:100%;min-width:660px;font-size:13.5px}
.heat th,.heat td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.heat thead th{font-weight:600;border-bottom:2px solid var(--line)}
.heat th:first-child{text-align:left}
.heat tbody th{font-weight:600}
.heat .lnk{border:0;background:none;padding:0;font-weight:600;cursor:pointer;color:inherit}
.heat .lnk:hover{text-decoration:underline}
.heat tr.cur th{box-shadow:inset 3px 0 0 var(--brand)}
.heat .pn{display:inline-flex;align-items:center;gap:6px}
.heat .pn i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.heat td.hc.hi{color:#0E1A22;font-weight:600}
.heat td.nod{color:var(--muted);text-align:left;font-style:italic}
.heat td.cd{color:var(--muted)}
.heat tfoot th,.heat tfoot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}
.gr{display:inline-block;width:90px;height:10px;border-radius:5px;background:linear-gradient(90deg,transparent,rgba(87,187,138,.85));box-shadow:inset 0 0 0 1px var(--line)}
/* Rapport */
.report{max-width:940px}
.rp-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:6px 20px;padding-bottom:14px;border-bottom:2px solid var(--ink);margin-bottom:16px}
.rp-head h2{margin:0;font-size:28px;letter-spacing:-.02em;line-height:1.1}
.rp-head p{margin:0;color:var(--muted);font-size:13.5px}
.rp-sec{margin-top:16px}
.rp-sec>h3{margin:0 0 8px;font-size:15.5px}
.rp2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
table.rt{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.rt th,.rt td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line)}
.rt th:first-child,.rt td:first-child{text-align:left}
.rt thead th{font-weight:600;border-bottom:2px solid var(--ink)}
.rt .pn{display:inline-flex;align-items:center;gap:7px;font-weight:600}
.rt .pn i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.rt td.b{font-weight:700}
a.btn{text-decoration:none;display:inline-block}
.gp{color:var(--pos);font-weight:600}.gn{color:var(--neg);font-weight:600}

<script>
/* Mini moteur de formules Excel : références, plages, inter-feuilles, SUM, AVERAGE, etc. */
const XL = (function () {
  const ERR = (e) => ({ e });
  const isErr = (v) => v && typeof v === "object" && "e" in v;

  const colToNum = (s) => s.split("").reduce((n, ch) => n * 26 + ch.charCodeAt(0) - 64, 0);
  const numToCol = (n) => { let s = ""; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };
  const splitRef = (a) => { const m = /^\$?([A-Z]{1,3})\$?(\d+)$/.exec(a); return { c: colToNum(m[1]), r: +m[2] }; };

  /* ---------- Tokenizer ---------- */
  const REF = "\\$?[A-Z]{1,3}\\$?\\d+";
  const TOKEN = new RegExp(
    "\\s*(?:" +
    "(?<num>\\d+(?:\\.\\d+)?(?:[eE][+-]?\\d+)?)" +
    "|(?<str>\"(?:[^\"]|\"\")*\")" +
    "|(?<ref>(?:(?:'(?<qs>[^']+)'|(?<us>[A-Za-z_\\u00C0-\\u024F][\\w\\u00C0-\\u024F.]*))!)?(?<a>" + REF + ")(?::(?<b>" + REF + "))?)(?![\\w(])" +
    "|(?<fn>[A-Za-z][A-Za-z0-9.]*)(?=\\()" +
    "|(?<op><=|>=|<>|[-+*/^&=<>(),%])" +
    ")", "y");

    const toks = []; let pos = 0;

      const m = TOKEN.exec(src);

      pos = TOKEN.lastIndex; const g = m.groups;

      else if (g.str !== undefined) toks.push({ t: "str", v: g.str.slice(1, -1).replace(/""/g, '"') });
      else if (g.a !== undefined) toks.push({ t: "ref", sheet: g.qs || g.us || null, a: g.a.replace(/\$/g, ""), b: g.b ? g.b.replace(/\$/g, "") : null, raw: m[0].trim() });

    const toks = tokenize(formula.replace(/^=/, ""));

      while (isOp("^")) { next(); l = { k: "bin", op: "^", l, r: unary() }; }

function niceMax(v) { if (v <= 0) return 10; const e = Math.pow(10, Math.floor(Math.log10(v))), f = v / e; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e; }

function drawStacked(el, cfg) {
  const W = cw(el), H = chH(el, cfg.height || 260), ml = 46, mr = 8, mt = 12, mb = 28, pw = W - ml - mr, ph = H - mt - mb, n = cfg.labels.length, band = pw / n;
  const totals = cfg.labels.map((_, i) => cfg.series.reduce((s, x) => s + (x.vals[i] || 0), 0));
  const max = niceMax(Math.max.apply(null, totals.concat([1])));
  const y = (v) => mt + ph - (v / max) * ph;
  let s = "<svg viewBox=\"0 0 " + W + " " + H + "\" role=\"img\" aria-label=\"" + attr(cfg.aria) + "\">";
  for (let k = 0; k <= 4; k++) { const v = (max / 4) * k, yy = y(v); s += "<line class=\"gl\" x1=\"" + ml + "\" x2=\"" + (W - mr) + "\" y1=\"" + yy + "\" y2=\"" + yy + "\"/><text x=\"" + (ml - 8) + "\" y=\"" + (yy + 4) + "\" text-anchor=\"end\">" + fmt(v, v % 1 ? 1 : 0) + "</text>"; }
  if (cfg.sel !== undefined && cfg.sel !== null) s += "<rect class=\"selb\" x=\"" + (ml + band * cfg.sel) + "\" y=\"" + mt + "\" width=\"" + band + "\" height=\"" + ph + "\" rx=\"6\"/>";
  const bw = Math.min(38, band * 0.62);
  cfg.labels.forEach((lb, i) => {
    let acc = 0; const x0 = ml + band * i + (band - bw) / 2;
    cfg.series.forEach((sr) => { const v = sr.vals[i] || 0; if (v <= 0) return; const h = (v / max) * ph; s += "<rect x=\"" + x0 + "\" y=\"" + (y(acc + v)) + "\" width=\"" + bw + "\" height=\"" + Math.max(h, 0.5) + "\" style=\"fill:" + sr.color + "\"/>"; acc += v; });
    s += "<text x=\"" + (ml + band * (i + 0.5)) + "\" y=\"" + (H - 8) + "\" text-anchor=\"middle\"" + (i === cfg.sel ? " style=\"font-weight:700;fill:var(--ink)\"" : "") + ">" + (band < 30 ? lb[0] : lb) + "</text>";
    const rows = cfg.series.filter((sr) => (sr.vals[i] || 0) > 0).map((sr) => ({ c:sr.color, n:sr.name, v:fmt(sr.vals[i]) }));
    if (rows.length > 1) rows.push({ c:"transparent", n:"Total", v:fmt(totals[i]) });
    s += "<rect class=\"hit\" x=\"" + (ml + band * i) + "\" y=\"" + mt + "\" width=\"" + band + "\" height=\"" + ph + "\" rx=\"6\"" + (cfg.pick ? " data-pick=\"" + i + "\" style=\"cursor:pointer\"" : "") + " data-tip=\"" + attr(tipHtml((cfg.tips || MONTHS)[i], rows.length ? rows : [{ c:"transparent", n:"Aucune donnée", v:"" }])) + "\"/>";
  });

}

function drawLine(el, cfg) {

  const vis = cfg.series;
  const all = []; vis.forEach((sr) => sr.vals.forEach((v) => { if (v !== null && v !== undefined) all.push(v); }));
  const max = niceMax(Math.max.apply(null, all.concat([1])) * 1.02);
  const y = (v) => mt + ph - (v / max) * ph, x = (i) => ml + band * (i + 0.5);
  let s = "<svg viewBox=\"0 0 " + W + " " + H + "\" role=\"img\" aria-label=\"" + attr(cfg.aria) + "\">";
  for (let k = 0; k <= 4; k++) { const v = (max / 4) * k, yy = y(v); s += "<line class=\"gl\" x1=\"" + ml + "\" x2=\"" + (W - mr) + "\" y1=\"" + yy + "\" y2=\"" + yy + "\"/><text x=\"" + (ml - 8) + "\" y=\"" + (yy + 4) + "\" text-anchor=\"end\">" + fmt(v, v % 1 ? 1 : 0) + "</text>"; }
  if (cfg.sel !== undefined && cfg.sel !== null) s += "<rect class=\"selb\" x=\"" + (ml + band * cfg.sel) + "\" y=\"" + mt + "\" width=\"" + band + "\" height=\"" + ph + "\" rx=\"6\"/>";

  vis.forEach((sr) => {

  });

/* ---------- Projection de fin d'année ---------- */
function projData() {
  const y = S.year, lm = lastDataMonth();
  if (!PEOPLE.some((p) => pm(p, lm).has)) return null;
  const wd = (m) => workingDays(y, m), act = [];
  for (let m = 0; m < 12; m++) act.push(vol(m).tot);
  const done = act.slice(0, lm + 1).reduce((s, v) => s + v, 0), remM = [];
  for (let m = lm + 1; m < 12; m++) remM.push(m);
  const remD = remM.reduce((s, m) => s + wd(m), 0);
  const rate = (n) => { let v = 0, d = 0; for (let m = Math.max(0, lm - n + 1); m <= lm; m++) if (act[m] > 0) { v += act[m]; d += wd(m); } return d ? v / d : null; };
  const bases = [{ k:"last3", l:"3 derniers mois", r:rate(3) }, { k:"last6", l:"6 derniers mois", r:rate(6) }, { k:"ytd", l:"Depuis janvier", r:rate(12) }];
  bases.forEach((b) => { b.proj = b.r === null ? null : done + b.r * remD; });
  const sel = bases.find((b) => b.k === S.proj.base) || bases[2];
  const goal = typeof S.goal[y] === "number" ? S.goal[y] : null;
  const need = goal !== null && remD > 0 ? Math.max(goal - done, 0) / remD : null;
  const pc = prevCtx(); let prevTot = null, prevCum = null;
  if (pc) { let t = 0; prevCum = []; for (let m = 0; m < 12; m++) { t += vol(m, pc).tot; prevCum.push(t); } prevTot = t || null; if (!prevTot) prevCum = null; }
  return { y, lm, wd, act, done, remM, remD, bases, sel, goal, need, prevTot, prevCum };
}
function projPanel() {
  const head = (extra) => `<div class="phd"><div><h2>Projection de fin d'année${info("proj")}</h2><p class="sub">Si l'équipe garde le rythme par jour ouvré de la base choisie.</p></div>${extra || ""}</div>`;
  const d = projData();
  if (!d) return { html:`<section class="panel" style="margin-top:16px">${head()}<p class="empty">Saisissez des chiffres pour obtenir une projection.</p></section>`, mount() {} };
  if (!d.remM.length) return { html:`<section class="panel" style="margin-top:16px">${head()}<p class="empty">Tous les mois de ${d.y} sont saisis : le total de l'année est de ${fmt(d.done)}.</p></section>`, mount() {} };
  const sel = d.sel, projTot = sel.proj, lmn = MONTHS[d.lm].toLowerCase();
  const picker = `<div class="mp"><select data-bind="projBase" aria-label="Base du calcul">${d.bases.map((b) => `<option value="${b.k}"${b.k === sel.k ? " selected" : ""}>Base : ${b.l.toLowerCase()}</option>`).join("")}</select></div>`;
  const k4 = d.goal !== null

    : `<div class="kpi"><span class="kl">Rythme retenu</span><span class="kv">${fmt(sel.r, 0)}<small>/ jour ouvré</small></span><span class="ks">Équipe, base : ${sel.l.toLowerCase()}</span></div>`;
  const kpis = `<section class="strip">` +
    `<div class="kpi"><span class="kl">Total projeté fin ${d.y}</span><span class="kv">${fmt(projTot)}</span><span class="ks">dont ${fmt(d.done)} déjà traités</span>${d.prevTot ? `<span class="ks">${deltaTxt(projTot, d.prevTot, "vs total " + (d.y - 1))}</span>` : ""}</div>` +
    `<div class="kpi"><span class="kl">Déjà traité</span><span class="kv">${fmt(d.done)}</span><span class="ks">${d.lm + 1} mois saisis, jusqu'à ${lmn}</span></div>` +
    `<div class="kpi"><span class="kl">Reste à traiter (projeté)</span><span class="kv">${fmt(sel.r * d.remD)}</span><span class="ks">${d.remD} jours ouvrés restants (${d.remM.length} mois)</span></div>` + k4 + `</section>`;
  const rows = d.bases.map((b) => `<tr style="${b.k === sel.k ? "font-weight:700" : ""}"><td>${b.l}</td><td>${fmt(b.r, 0)}</td><td>${fmt(b.proj)}</td>${d.prevTot ? `<td>${b.proj ? deltaTxt(b.proj, d.prevTot, "") : "—"}</td>` : ""}</tr>`).join("");
  const html = `<section class="panel" style="margin-top:16px">${head(picker)}${kpis}

      <div><h3 style="margin:0 0 8px;font-size:14.5px">Selon la base du calcul</h3><div class="rtw" style="overflow-x:auto"><table class="rt"><thead><tr><th>Base</th><th>Par jour ouvré</th><th>Total projeté</th>${d.prevTot ? `<th>vs ${d.y - 1}</th>` : ""}</tr></thead><tbody>${rows}</tbody></table></div>

    <p class="note-line">Hypothèse : le rythme par jour ouvré (jours fériés déduits) reste celui de la base choisie, et ${lmn} est considéré comme complet. Les mois d'été sont plus bas : comparez les bases.</p></section>`;
  const mountFn = () => {
    let c = 0; const real = [], proj = [];
    for (let m = 0; m < 12; m++) { if (m <= d.lm) { c += d.act[m]; real.push(c); } else real.push(null); }
    let cp = d.done; for (let m = 0; m < 12; m++) { if (m < d.lm) proj.push(null); else if (m === d.lm) proj.push(d.done); else { cp += sel.r * d.wd(m); proj.push(cp); } }
    const series = [{ name:"Réalisé", color:"var(--brand)", vals:real }, { name:"Projection", color:"var(--muted)", dash:true, vals:proj }];
    if (d.prevCum) series.push({ name:String(d.y - 1), color:"var(--c-ech)", dash:"2 3", noDots:true, vals:d.prevCum });
    if (d.goal !== null) series.push({ name:"Objectif", color:"var(--ink)", dash:"6 4", noDots:true, vals:M3.map(() => d.goal) });
    mount($("#chProj"), (el) => drawLine(el, { labels:M3, height:260, dec:0, aria:"Volume cumulé réalisé et projeté", series }));
  };
  return { html, mount:mountFn };
}

/* ---------- Comparaison de mois (fiche personne) ---------- */
const CMP_OPT = { team:true, abs:true };

function cmpData(p, xs) {
  const sel = (S.cmp[p.id] || []).filter((m) => xs[m].has).sort((a, b) => a - b);
  if (sel.length < 2) return { sel, d:null, rows:[] };
  const d = sel.map((m) => {
    const x = xs[m], adj = adjOf(x), ref = refAvg(m), pres = x.jours !== null ? x.jours - x.abs : null;
    return { m, x, adj, ref, pres, gap: adj !== null && ref ? (adj / ref - 1) * 100 : null };
  });
  const hasCli = d.some((r) => r.x.cli > 0), hasUrg = d.some((r) => r.x.urg > 0);
  const R = (l, g, f, mode, b, dir, k, grp) => ({ l, g, f, mode, b, dir, k, grp:grp || "" });
  const rows = [
    R("Mails", (r) => r.x.mail, (v) => fmt(v), "pct", false, 1, "cMail"),
    R("Échanges", (r) => r.x.ech, (v) => fmt(v), "pct", false, 1, "cEch")
  ];
  if (hasCli) rows.push(R("Échanges clients", (r) => r.x.cli, (v) => fmt(v), "pct", false, 1, "cCli"));
  if (hasUrg) rows.push(R("Urgences", (r) => r.x.urg, (v) => fmt(v), "pct", false, 1, "cUrg"));
  rows.push(
    R("Total traité", (r) => r.x.tot, (v) => fmt(v), "pct", true, 1, "cTot"),
    R("Jours du mois", (r) => r.x.jours, (v) => fmtG(v), "pct", false, 0, "cJours"),
    R("Jours de présence", (r) => r.pres, (v) => fmtG(v), "pct", false, 0, "cPres", "abs"),
    R("Absences (jours)", (r) => r.x.abs, (v) => fmtG(v), "pct", false, -1, "cAbs", "abs"),
    R("Productivité par jour de présence", (r) => r.x.prod, (v) => fmt(v, 1), "pct", true, 1, "cProd"),
    R("Productivité ajustée", (r) => r.adj, (v) => fmt(v, 1), "pct", true, 1, "cAdj"),
    R("Moyenne de référence équipe", (r) => r.ref, (v) => fmt(v, 1), "pct", false, 0, "cRef", "team"),
    R("Écart avec l'équipe", (r) => r.gap, (v) => signed(v, 0) + " %", "pt", true, 1, "cGap", "team")
  );
  return { sel, d, rows, hasCli, hasUrg };
}

function cmpTable(d, rows, cls, withInfo) {
  const A = d[0], Z = d[d.length - 1];
  const evN = (g, mode) => {
    const a = g(A), b = g(Z);
    if (a === null || a === undefined || b === null || b === undefined) return null;
    if (mode === "pt") return b - a;
    return a === 0 ? null : b / a - 1;
  };
  const evT = (g, mode) => { const n = evN(g, mode); return n === null ? "—" : mode === "pt" ? signed(n, 0) + " pt" : signed(n * 100, 0) + " %"; };
  const MN = d.length > 6 ? M3 : MONTHS;
  const head = `<thead><tr><th></th>${d.map((r) => `<th>${MN[r.m]}</th>`).join("")}<th>${MN[A.m]} → ${MN[Z.m]}${withInfo ? info("cEvo") : ""}</th></tr></thead>`;
  const body = rows.map((row) => {
    const n = evN(row.g, row.mode), rd = n === null ? 0 : (row.mode === "pt" ? Math.round(n) : Math.round(n * 100));
    const ec = row.dir && n !== null && rd !== 0 ? (rd * row.dir > 0 ? " gp" : " gn") : "";
    const isGap = row.grp === "team" && row.mode === "pt";
    const cells = d.map((r) => {
      const v = row.g(r), c = isGap && v !== null && v !== undefined && Math.round(v) !== 0 ? (v > 0 ? " gp" : " gn") : "", k = ((row.b ? "b" : "") + c).trim();
      return `<td${k ? ` class="${k}"` : ""}>${v === null || v === undefined ? "—" : row.f(v)}</td>`;
    }).join("");
    return `<tr><td>${row.l}${withInfo ? info(row.k) : ""}</td>${cells}<td class="b${ec}">${evT(row.g, row.mode)}</td></tr>`;
  }).join("");
  return `<table class="${cls}">${head}<tbody>${body}</tbody></table>`;
}

function cmpInsights(p, d, opt) {
  const A = d[0], Z = d[d.length - 1], nm = (r) => MONTHS[r.m].toLowerCase();
  const chg = (a, b) => (a ? (b / a - 1) * 100 : null), pct = (v) => signed(v, 0) + " %";
  const tc = chg(A.x.tot, Z.x.tot), parts = [];
  if (tc !== null) parts.push(`le volume traité passe de ${fmt(A.x.tot)} à ${fmt(Z.x.tot)} (${pct(tc)})`);
  if (A.adj !== null && Z.adj !== null) { const c = chg(A.adj, Z.adj); if (c !== null) parts.push(`la productivité ajustée de ${fmt(A.adj, 1)} à ${fmt(Z.adj, 1)} (${pct(c)})`); }
  let syn = `Entre ${nm(A)} et ${nm(Z)}${d.length > 2 ? ` (${d.length} mois comparés)` : ""}, ${parts.length ? parts.join(" et ") : "les données sont insuffisantes pour calculer une évolution"}.`;
  if (opt.team && A.gap !== null && Z.gap !== null) syn += ` L'écart avec l'équipe passe de ${signed(A.gap, 0)} % à ${signed(Z.gap, 0)} %.`;
  const pts = [], wa = d.filter((r) => r.adj !== null);
  if (wa.length >= 2) {
    const best = wa.slice().sort((a, b) => b.adj - a.adj)[0], low = wa.slice().sort((a, b) => a.adj - b.adj)[0];
    if (best.m !== low.m) pts.push(`Meilleur mois : ${nm(best)} (${fmt(best.adj, 1)} par jour). Mois le plus bas : ${nm(low)} (${fmt(low.adj, 1)}).`);
  }

function drawCmpBars(el, cfg) {
  const W = cw(el), H = chH(el, cfg.height || 210), ml = 40, mr = 8, mt = 20, mb = 26, pw = W - ml - mr, ph = H - mt - mb, n = cfg.labels.length, band = pw / n;

  const max = niceMax(Math.max.apply(null, all.concat([1])) * 1.05), y = (v) => mt + ph - (v / max) * ph;

  for (let k = 0; k <= 4; k++) { const v = (max / 4) * k, yy = y(v); s += "<line class=\"gl\" x1=\"" + ml + "\" x2=\"" + (W - mr) + "\" y1=\"" + yy + "\" y2=\"" + yy + "\"/><text x=\"" + (ml - 8) + "\" y=\"" + (yy + 4) + "\" text-anchor=\"end\">" + fmt(v, v % 1 ? 1 : 0) + "</text>"; }
  const bw = Math.min(46, band * 0.55), showVal = band >= 34;

    if (rf !== null && rf !== undefined) s += "<line x1=\"" + (cx - bw / 2 - 7).toFixed(1) + "\" x2=\"" + (cx + bw / 2 + 7).toFixed(1) + "\" y1=\"" + y(rf).toFixed(1) + "\" y2=\"" + y(rf).toFixed(1) + "\" style=\"stroke:var(--ink)\" stroke-width=\"2\" stroke-dasharray=\"4 3\"/>";

const HEAT_ORDER = ["Pierrick", "Anais", "Charlotte", "Clara", "Léa", "Ben", "Régis", "Virginie"];

function ensureFormulas(p, m) {
  const L = LAY[p.layout], r = m + 2, all4 = all4of(p, m);
  if (!book.isFormula(p.id, L.tot + r)) book.setRaw(p.id, L.tot + r, all4 ? "=SUM(B" + r + ":E" + r + ")" : "=SUM(B" + r + ":C" + r + ")");
  if (!book.isFormula(p.id, L.moy + r)) book.setRaw(p.id, L.moy + r, "=" + L.tot + r + "/" + L.jours + r);
  if (!book.isFormula(p.id, L.prod + r)) book.setRaw(p.id, L.prod + r, "=" + L.tot + r + "/(" + L.jours + r + "-" + L.abs + r + ")");
}

  const bad = ["mail", "ech", "cli", "urg", "jours", "abs", "coef"].filter((k) => val(k) === null);
  if (bad.length) { toast("Certaines valeurs ne sont pas des nombres."); return; }
  ["mail", "ech", "cli", "urg", "jours", "abs"].forEach((k) => { if (L[k]) book.setRaw(p.id, L[k] + r, val(k)); });
  ensureFormulas(p, m);
  const c = val("coef"); S.coef[p.id][m] = c === undefined ? 1 : c;
  S.notes[p.id][m] = dlg.querySelector("[data-f=\"note\"]").value.trim();
  if (L.note) book.setRaw(p.id, L.note + r, S.notes[p.id][m] || undefined);
  book.valCache.clear(); save(); dlgInitial = null; closeDlg(true); render(true); toast("Enregistré");
}
function closeDlg(force) {
  if (!force && dlgDirty() && !window.confirm("Fermer sans enregistrer les modifications ?")) return false;
  dlgInitial = null;
  const d = $("#dlg"); if (d.close) d.close(); else d.removeAttribute("open");
  return true;
}

/* =====================================================================
   8. Événements et affichage
   ===================================================================== */
document.addEventListener("click", (e) => {
  const pick = e.target.closest("[data-pick]");
  if (pick) { S.month = +pick.dataset.pick; render(true); return; }
  const a = e.target.closest("[data-action]"); if (!a) return;
  const act = a.dataset.action;
  if (act === "mprev") { S.month = (S.month + 11) % 12; render(true); }
  else if (act === "mnext") { S.month = (S.month + 1) % 12; render(true); }
  else if (act === "print") window.print();
  else if (act === "present") document.body.classList.add("presenting");
  else if (act === "present-exit") document.body.classList.remove("presenting");
  else if (act === "edit") openEdit(a.dataset.p, +a.dataset.m);
  else if (act === "save-dlg") saveEdit(a.dataset.p, +a.dataset.m);
  else if (act === "close-dlg") closeDlg();
  else if (act === "toggle-line") { S.lineOff[a.dataset.id] = !S.lineOff[a.dataset.id]; render(true); }
  else if (act === "cmp-toggle") {
    const id = route().id, l = (S.cmp[id] = S.cmp[id] || []), m = +a.dataset.m, i = l.indexOf(m);
    if (i >= 0) l.splice(i, 1); else l.push(m);
    render(true);
  }
  else if (act === "cmp-clear") { S.cmp[route().id] = []; render(true); }
  else if (act === "cmp-preset") {
    const id = route().id, pp = P(id), has = MONTHS.map((_, m) => (pm(pp, m).has ? m : -1)).filter((m) => m >= 0), v = a.dataset.v;
    S.cmp[id] = v === "all" ? has : v === "last3" ? has.slice(-3) : has.slice(-2); render(true);
  }
  else if (act === "cmp-print") { document.body.classList.add("print-cmp"); window.print(); }
  else if (act === "theme") { S.theme = a.dataset.v; applyTheme(); save(); render(true); }
  else if (act === "export") {
    const blob = new Blob([JSON.stringify(payload(), null, 1)], { type:"application/json" }), u = URL.createObjectURL(blob), l = document.createElement("a");
    l.href = u; l.download = "productivite-easy.json"; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 500);
  }
  else if (act === "import") $("#importFile").click();
  else if (act === "logo-pick") $("#logoFile").click();
  else if (act === "logo-clear") { S.logo = ""; save(); render(true); toast("Logo retiré"); }
  else if (act === "year-add") addYear(parseInt($("#newYear").value, 10));
  else if (act === "year-del") removeYear(S.year);
  else if (act === "reset") {
    if (!window.confirm("Effacer les chiffres de " + BASE_YEAR + " ?")) return;
    stash(); YEARS[BASE_YEAR] = baseDefault(); if (S.year === BASE_YEAR) activate(BASE_YEAR); else prevCache = {};
    save(); render(true); toast("Année remise à zéro");
  }
});
document.addEventListener("input", (e) => {
  const f = e.target.dataset && e.target.dataset.bilan; if (!f) return;
  const id = route().id; (S.bilan[id] = S.bilan[id] || {})[f] = e.target.value;
  const po = $("#po_" + f); if (po) po.textContent = e.target.value;
  save();
});
document.addEventListener("change", (e) => {
  const b = e.target.dataset && e.target.dataset.bind; if (!b) return;
  if (b === "cible") { const n = parseNum(e.target.value); (S.bilan[e.target.dataset.id] = S.bilan[e.target.dataset.id] || {}).cible = n === null ? undefined : n; save(); render(true); return; }
  if (b === "year") { switchYear(+e.target.value); return; }
  if (b === "projBase") { S.proj.base = e.target.value; render(true); return; }
  if (b === "goal") { const n = parseNum(e.target.value); if (n === null) { toast("Valeur non numérique."); return; } if (n === undefined) delete S.goal[S.year]; else S.goal[S.year] = n; save(); render(true); return; }
  if (b === "rptopt") { RPT_OPT[e.target.dataset.key] = e.target.checked; render(true); return; }
  if (b === "cmpopt") { CMP_OPT[e.target.dataset.key] = e.target.checked; render(true); return; }
  if (b === "bmeta") { const id = route().id; (S.bilan[id] = S.bilan[id] || {})[e.target.dataset.key] = e.target.value; save(); render(true); return; }
  if (b === "bopt") { const id = route().id; (S.bilan[id] = S.bilan[id] || {})[e.target.dataset.key] = e.target.checked; save(); render(true); return; }
  if (b === "pdMonth") { S.pdMonth = e.target.value === "" ? null : +e.target.value; render(true); return; }
  if (b === "month") S.month = +e.target.value;
  else if (b === "incl") { S.incl[e.target.dataset.id] = e.target.checked; save(); }
  else if (b === "fxp") S.fx.p = e.target.value;
  else if (b === "fxm") S.fx.m = +e.target.value;
  render(true);
});
$("#importFile").addEventListener("change", (e) => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { try { applyPayload(JSON.parse(rd.result)); applyTheme(); save(); render(true); toast("Données importées"); } catch (err) { toast("Import impossible : " + err.message); } };
  rd.readAsText(f); e.target.value = "";
});
$("#logoFile").addEventListener("change", (e) => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { const img = new Image(); img.onload = () => { const k = Math.min(1, 700 / img.width), c = document.createElement("canvas"); c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k)); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); S.logo = c.toDataURL("image/png"); save(); render(true); toast("Logo enregistré"); }; img.onerror = () => toast("Image illisible."); img.src = rd.result; };
  rd.readAsDataURL(f); e.target.value = "";
});
$("#dlg").addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.tagName === "INPUT") { e.preventDefault(); const b = $("#dlg [data-action=\"save-dlg\"]"); if (b) b.click(); } });
$("#dlg").addEventListener("cancel", (e) => {
  if (dlgDirty()) {
    e.preventDefault();
    if (window.confirm("Fermer sans enregistrer les modifications ?")) { dlgInitial = null; const d = $("#dlg"); if (d.close) d.close(); else d.removeAttribute("open"); }
  }
});
window.addEventListener("beforeunload", (e) => {
  if ($("#dlg").hasAttribute("open") && dlgDirty()) { e.preventDefault(); e.returnValue = ""; }
});
window.addEventListener("hashchange", () => render(false));
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && document.body.classList.contains("presenting")) document.body.classList.remove("presenting"); });

let lastKey = "";
function render(keepScroll) {
  const r = route();
  charts.length = 0; tipEl.hidden = true;
  renderSide(r);
  const view = r.name === "personne" ? viewPerson(r.id) : r.name === "equipe" ? viewTeam() : r.name === "formules" ? viewFormulas() : r.name === "rapport" ? viewReport() : r.name === "bilan" ? viewBilan(r.id) : r.name === "reglages" ? viewSettings() : viewDashboard();
  const y = window.scrollY;
  $("#main").innerHTML = view.html;
  view.after();
  const key = r.name + (r.id || "");
  if (!keepScroll || key !== lastKey) window.scrollTo(0, 0); else window.scrollTo(0, y);
  lastKey = key;
  document.title = (r.name === "personne" ? r.id : r.name === "bilan" ? "Bilan de " + r.id : { dashboard:"Tableau de bord", equipe:"Équipe", formules:"Formules", rapport:"Rapport", reglages:"Réglages" }[r.name]) + " · Productivité EASY " + String(S.year).slice(2);
}
S.month = lastDataMonth(); S.fx.m = S.month;
render(false);
window.__app = { book, S, pm, vol, cadence, refAvg, render, PEOPLE, YEARS, switchYear, addYear, workingDays, projData, prevCtx };
})();
</script>
